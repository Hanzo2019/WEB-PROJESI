<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Platformu - Kendin Yap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #ffa600;
            color: white;
            padding: 10px 20px; /* Üst ve alt boşluk küçültüldü */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 {
            font-size: 1.2rem; /* Başlık boyutu da biraz daha zarif hale getirildi */
            margin: 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .hero {
            text-align: center;
            padding: 40px 20px;
        }
        .hero h1 {
            color: #ffa600;
        }
        .btn {
            display: inline-block;
            background-color: #ffa600;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #ffa600;
        }
    </style>
</head>
<body>

    <header>
        <h2>🛠️ DIY Platformu</h2>
        <nav>
            <a href="#">Ana Sayfa</a>
            <a href="#">Keşfet</a>
            <a href="#">Proje Ekle</a>
            <a href="#">Giriş Yap</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Kendi Projelerini Keşfet ve Paylaş!</h1>
            <p>Üye olarak binlerce Kendin Yap (DIY) fikrini inceleyebilir, kendi el emeği projelerini toplulukla paylaşabilirsin.</p>
            <a href="#" class="btn">Hemen Başla</a>
        </div>
    </div>

</body>
</html>
